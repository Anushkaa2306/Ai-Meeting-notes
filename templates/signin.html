<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MeetingMind AI | Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Slackey&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

<div class="login-bg"></div>

<div class="login-wrapper">

<div class="login-card">

<div class="logo-area">

<div class="logo-circle">

<img src="{{ url_for('static', filename='images/ai-bot.png') }}" alt="MeetingMind AI">

</div>

<h1>MeetingMind AI</h1>

<p>
AI Powered Meeting Assistant
</p>

</div>

<form action="{{ url_for('signin') }}" method="POST">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter your password"
required>

</div>

<button class="login-btn">

Sign In

</button>

</form>

{% with messages = get_flashed_messages() %}
{% if messages %}

<div class="flash-box">

{% for message in messages %}

<p>{{ message }}</p>

{% endfor %}

</div>

{% endif %}
{% endwith %}

<div class="divider">

<span>OR</span>

</div>

<a href="{{ url_for('signup') }}" class="signup-link">

Create New Account

</a>

</div>

</div>
<style>
    /* ===================================
   MEETINGMIND AI SIGN IN PAGE
   PREMIUM GLASS UI
=================================== */


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}



body.login-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;


    overflow:hidden;


    background:

    radial-gradient(circle at top left,
    #07080b97,
    transparent 35%),


    radial-gradient(circle at bottom right,
    #38bdf8,
    transparent 35%),


    #050816;

}



/* Background Glow */


.login-bg{


    position:absolute;


    width:650px;

    height:650px;


    border-radius:50%;


    background:

    linear-gradient(
    135deg,
    rgba(31, 20, 247, 0.45),
    rgba(56,189,248,.35)
    );


    filter:blur(100px);


    animation:

    floating 8s infinite alternate ease-in-out;


}



@keyframes floating{


from{

transform:translate(-150px,-100px);

}


to{

transform:translate(150px,100px);

}


}




/* Main Wrapper */


.login-wrapper{

    position:relative;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:2;

}



/* Login Card */


.login-card{


    width:430px;


    padding:42px 45px;



    background:

    rgba(255,255,255,.08);



    backdrop-filter:

    blur(25px);



    border-radius:30px;



    border:

    1px solid rgba(255,255,255,.18);



    box-shadow:


    0 25px 70px rgba(0,0,0,.5),


    inset 0 0 40px rgba(255,255,255,.05);



    animation:

    cardAnimation .8s ease;



}




@keyframes cardAnimation{


from{

opacity:0;

transform:

translateY(50px)
scale(.95);

}


to{

opacity:1;

transform:

translateY(0)
scale(1);

}


}



/* Logo */


.logo-area{

    text-align:center;

    margin-bottom:35px;

}




.logo-circle{


    width:95px;

    height:95px;


    margin:auto;


    border-radius:50%;


    display:flex;

    justify-content:center;

    align-items:center;



    background:


    linear-gradient(
    135deg,
    #1d54c2,
    #38bff874
    );



    box-shadow:


    0 0 45px rgba(56,189,248,.6);



    animation:

    logoPulse 3s infinite;


}



.logo-circle img{


    width:58px;

    height:58px;

    object-fit:contain;


}



@keyframes logoPulse{


0%{

box-shadow:

0 0 20px rgba(56,189,248,.3);

}


50%{

box-shadow:

0 0 55px rgba(10, 34, 250, 0.8);

}


100%{

box-shadow:

0 0 20px rgba(56,189,248,.3);

}


}





.logo-area h1{


    margin-top:20px;


    font-family:"Slackey";


    font-size:32px;


    letter-spacing:1px;



    background:


    linear-gradient(
    90deg,
    white,
    #38bff86f,
    #8b92fa
    );



    -webkit-background-clip:text;

    color:transparent;


}



.logo-area p{


    margin-top:10px;


    color:#cbd5e1;


    font-size:14px;


}





/* Inputs */


.input-group{


    margin-bottom:20px;


}



.input-group label{


    display:block;


    color:#e2e8f0;


    font-size:14px;


    margin-bottom:8px;


}



.input-group input{


    width:100%;


    padding:15px 17px;


    border-radius:15px;



    outline:none;



    background:

    rgba(255,255,255,.08);



    border:

    1px solid rgba(255,255,255,.2);



    color:white;



    font-size:14px;



    transition:.35s;


}



.input-group input::placeholder{


    color:#94a3b8;


}



.input-group input:focus{


    background:

    rgba(255,255,255,.13);



    border-color:#38bdf8;



    box-shadow:


    0 0 20px rgba(56,189,248,.45);


}





/* Sign In Button */


.login-btn{


    width:100%;


    padding:15px;


    margin-top:10px;



    border:none;


    border-radius:16px;



    cursor:pointer;


    font-size:16px;


    font-weight:600;


    color:white;



    background:


    linear-gradient(
    135deg,
    #5c85f6,
    #3875f8
    );



    position:relative;


    overflow:hidden;


    transition:.4s;


}



.login-btn:hover{


    transform:

    translateY(-4px);



    box-shadow:


    0 18px 40px rgba(56,189,248,.5);


}





.login-btn::before{


    content:"";


    position:absolute;


    width:120px;

    height:300px;


    background:

    rgba(255,255,255,.35);



    transform:rotate(30deg);


    left:-180px;


    top:-100px;



    transition:.6s;


}



.login-btn:hover::before{


    left:420px;


}





/* Flash Message */


.flash-box{


    margin-top:20px;


    padding:13px;


    border-radius:14px;


    text-align:center;



    color:white;



    background:


    rgba(239,68,68,.2);



    border:

    1px solid rgba(239,68,68,.4);


}



/* Divider */


.divider{


    display:flex;


    align-items:center;


    gap:15px;



    margin:28px 0;


    color:#94a3b8;


}



.divider::before,
.divider::after{


    content:"";


    height:1px;


    flex:1;


    background:

    rgba(255,255,255,.2);


}




.divider span{


    font-size:13px;

}





/* Signup Link */


.signup-link{


    display:block;


    text-align:center;



    text-decoration:none;


    color:#38bdf8;



    font-size:15px;


    transition:.3s;


}



.signup-link:hover{


    color:#728cf4;



    text-shadow:


    0 0 15px #38bdf8;


}




/* Mobile */


@media(max-width:500px){


.login-card{


width:90%;


padding:35px 25px;


}



.logo-area h1{


font-size:25px;


}


}
</style>
</body>
</html>
