<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | MeetingMind AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Slackey&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='/style.css') }}">

</head>

<body class="login-page">
    <div class="welcome-screen">

    <div class="welcome-content">

        <div class="welcome-logo">
            <img src="{{ url_for('static', filename='images/ai-bot.png') }}">
        </div>

        <h1>
            Welcome to 
            <span>MeetingMind AI</span>
        </h1>

        <p>
            Your AI powered meeting assistant
        </p>

    </div>

</div>

<div class="login-bg"></div>

<div class="login-wrapper">

<div class="login-card">

<div class="logo-area">

<div class="logo-circle">

<img src="{{ url_for('static', filename='images/ai-bot.png') }}" alt="MeetingMind">

</div>

<h1>MeetingMind AI</h1>

<p>Create your free account</p>

</div>

<form action="{{ url_for('signup') }}" method="POST">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Enter your name"
required>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Create password"
required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm password"
required>

</div>

<button class="login-btn">

Create Account

</button>

</form>

{% with messages = get_flashed_messages() %}
{% if messages %}

<div class="flash-box">

{% for message in messages %}

<p>{{ message }}</p>

{% endfor %}

</div>

{% endif %}
{% endwith %}

<div class="divider">

<span>OR</span>

</div>

<a href="{{ url_for('signin') }}" class="signup-link">

Already have an account? Sign In

</a>

</div>

</div>
<style>
/* ==============================
   WELCOME LOADING SCREEN
============================== */


.welcome-screen{

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at center,
    #132692,
    #050816);


    display:flex;

    justify-content:center;

    align-items:center;


    z-index:999;


    animation:

    hideWelcome 1s ease 3s forwards;

}



.welcome-content{

    text-align:center;

    animation:

    welcomePop 1.5s ease;


}



.welcome-logo{


    width:120px;

    height:120px;


    margin:auto;


    border-radius:50%;


    display:flex;

    justify-content:center;

    align-items:center;


    background:

    linear-gradient(
    135deg,
    #032c7d,
    #2e97f8
    );


    box-shadow:

    0 0 60px rgba(56,189,248,.8);


    animation:

    welcomePulse 2s infinite;


}



.welcome-logo img{

    width:100%;

    height:100%;

}





.welcome-content h1{


    margin-top:30px;


    color:white;


    font-size:42px;


    


    letter-spacing:1px;


}



.welcome-content h1 span{

font-family:"Slackey";
    background:

    linear-gradient(
    90deg,
    #6e99f5f7,
    #7b8ef6
    );


    -webkit-background-clip:text;

    color:transparent;


}



.welcome-content p{


    margin-top:15px;


    color:#cbd5e1;


    font-size:18px;


}





@keyframes welcomePop{


from{

opacity:0;

transform:scale(.5);

}


to{

opacity:1;

transform:scale(1);

}


}





@keyframes welcomePulse{


0%{

box-shadow:

0 0 30px rgba(56,189,248,.5);

}


50%{

box-shadow:

0 0 80px rgba(2, 30, 113, 0.9);

}


100%{

box-shadow:

0 0 30px rgba(56,189,248,.5);

}


}





@keyframes hideWelcome{


0%{

opacity:1;

visibility:visible;

}


80%{

opacity:0;

}


100%{

opacity:0;

visibility:hidden;

}

}
/* ================================
   MEETINGMIND AI SIGNUP PAGE
   PREMIUM GLASS UI
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body.login-page {

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 15px;

    overflow-y:auto;

    background:
    radial-gradient(circle at top left,#132692,transparent 35%),
    radial-gradient(circle at bottom right,#38bff87c,transparent 35%),
    #050816;

}
/* Animated Background */

.login-bg {

    position: absolute;
    width: 600px;
    height: 600px;

    background:
    linear-gradient(
        135deg,
        rgba(55, 61, 249, 0.4),
        rgba(56,189,248,.3)
    );

    filter: blur(90px);

    border-radius:50%;

    animation: floatBg 8s infinite alternate ease-in-out;

}


@keyframes floatBg {

    from{
        transform:translate(-120px,-80px);
    }

    to{
        transform:translate(120px,80px);
    }

}


/* Wrapper */

.login-wrapper {

    position:relative;

    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;

    z-index:2;

}



/* Card */

.login-card {

    width:430px;

    max-height:95vh;

    overflow-y:auto;

    padding:32px 40px;


    background:
    rgba(255,255,255,0.08);


    backdrop-filter:blur(25px);


    border-radius:28px;


    border:
    1px solid rgba(255,255,255,.18);


    box-shadow:

    0 25px 60px rgba(0,0,0,.45),
    inset 0 0 40px rgba(255,255,255,.05);


    animation:cardShow .8s ease;

}   



@keyframes cardShow {

    from{

        opacity:0;
        transform:translateY(40px) scale(.95);

    }

    to{

        opacity:1;
        transform:translateY(0) scale(1);

    }

}



/* Logo */

.logo-area {

    text-align:center;
    margin-bottom:30px;

}


.logo-circle {


    width:85px;
    height:85px;

    margin:auto;


    border-radius:50%;


    display:flex;
    align-items:center;
    justify-content:center;


    background:

    linear-gradient(
        135deg,
        #050e6c,
        #38bdf8
    );


    box-shadow:

    0 0 40px rgba(56,189,248,.5);


    animation:pulse 3s infinite;

}

.logo-circle img {

    width:65px;
    height:55px;

}



@keyframes pulse {

    0%{
        box-shadow:0 0 20px rgba(56,189,248,.3);
    }

    50%{
        box-shadow:0 0 50px rgba(92, 151, 246, 0.8);
    }

    100%{
        box-shadow:0 0 20px rgba(56,189,248,.3);
    }

}



.logo-area h1 {


    margin-top:20px;


    font-family:"Slackey";


    font-size:30px;


    letter-spacing:1px;


    background:

    linear-gradient(
    90deg,
    #fff,
    #38bdf8,
    #200572
    );


    -webkit-background-clip:text;

    color:transparent;

}



.logo-area p {

    color:#cbd5e1;

    font-size:14px;

    margin-top:8px;

}




/* Inputs */


.input-group {

    margin-bottom:18px;

}



.input-group label {


    display:block;


    color:#e2e8f0;


    font-size:14px;


    margin-bottom:7px;

}



.input-group input {


    width:100%;


    padding:14px 16px;


    border-radius:14px;


    outline:none;


    border:

    1px solid rgba(255,255,255,.2);



    background:

    rgba(255,255,255,.08);



    color:white;


    font-size:14px;


    transition:.3s;


}



.input-group input::placeholder{

    color:#94a3b8;

}




.input-group input:focus {


    border-color:#38bdf8;


    box-shadow:

    0 0 15px rgba(56,189,248,.4);


    background:

    rgba(255,255,255,.12);


}





/* Button */


.login-btn {


    width:100%;


    margin-top:10px;


    padding:15px;


    border:none;


    border-radius:16px;


    cursor:pointer;


    font-size:16px;


    font-weight:600;


    color:white;



    background:


    linear-gradient(
        135deg,
        #2119b3,
        #38bdf8
    );



    transition:.4s;


    position:relative;


    overflow:hidden;


}




.login-btn:hover {


    transform:translateY(-3px);


    box-shadow:

    0 15px 35px rgba(56,189,248,.4);


}



.login-btn::before {


    content:"";


    position:absolute;


    width:100px;

    height:300px;


    background:

    rgba(255,255,255,.35);


    transform:rotate(30deg);


    left:-150px;


    top:-100px;


    transition:.6s;


}


.login-btn:hover::before{

    left:400px;

}



/* Flash Message */


.flash-box {


    margin-top:20px;


    padding:12px;


    border-radius:12px;


    text-align:center;


    color:white;


    background:

    rgba(239,68,68,.2);


    border:

    1px solid rgba(239,68,68,.4);

}




/* Divider */


.divider {


    display:flex;


    align-items:center;


    gap:15px;


    margin:25px 0;


    color:#94a3b8;


}



.divider::before,
.divider::after {


    content:"";

    height:1px;

    flex:1;


    background:

    rgba(255,255,255,.2);

}



.divider span {

    font-size:13px;

}



/* Signin Link */


.signup-link {


    display:block;


    text-align:center;


    text-decoration:none;


    color:#38bdf8;


    font-size:15px;


    transition:.3s;


}



.signup-link:hover {


    color:#2542e5;


    text-shadow:

    0 0 15px #38bdf8;


}




/* Responsive */


@media(max-width:500px){


.login-card{

    width:90%;

    padding:35px 25px;

}


.logo-area h1{

    font-size:24px;

}


}</style>
</body>

</html>
